<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAT & ACT Practice Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a quiet test booklet — section tabs across the top, a numbered answer grid on the left,
   passage and question side by side, nothing timed, nothing locked. */
:root {
  --paper: #f6f7f9;
  --sheet: #ffffff;
  --ink: #1b2433;
  --muted: #5f6b7d;
  --line: #dde2ea;
  --accent: #2446a8;
  --accent-soft: #e8edfb;
  --good: #1d7a4a;
  --good-soft: #e3f4ea;
  --bad: #b3322b;
  --bad-soft: #fbe7e5;
  --mark: #fff3c4;
  --display: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --reading: "Source Serif 4", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12161d; --sheet: #1a2029; --ink: #e6eaf1; --muted: #9aa5b6; --line: #2c3442;
    --accent: #8fa8ff; --accent-soft: #232c45; --good: #5fd08f; --good-soft: #17301f;
    --bad: #ff8a80; --bad-soft: #3a1e1c; --mark: #4a4220; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12161d; --sheet: #1a2029; --ink: #e6eaf1; --muted: #9aa5b6; --line: #2c3442;
  --accent: #8fa8ff; --accent-soft: #232c45; --good: #5fd08f; --good-soft: #17301f;
  --bad: #ff8a80; --bad-soft: #3a1e1c; --mark: #4a4220; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 56px; flex-wrap: wrap; padding-top: 6px; padding-bottom: 6px; }
.brand { font-weight: 700; letter-spacing: -0.01em; margin-right: auto; display: flex; gap: 8px; align-items: baseline; }
.brand span { font-weight: 500; }
.nav { display: flex; gap: 4px; }
.nav a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 8px; font-weight: 500; }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }

.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--bad); }

/* home */
.page { padding: 28px 0 64px; }
.page h1 { font-size: 26px; }
.lede { max-width: 64ch; margin: 6px 0 24px; }
.examgrid { display: grid; gap: 28px; grid-template-columns: 1fr 1fr; }
@media (max-width: 860px) { .examgrid { grid-template-columns: 1fr; } }
.examcol h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; }
.examcol .fmt { margin: -6px 0 12px; }
.cards { display: grid; gap: 10px; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.card .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card h3 { font-size: 16px; margin-right: auto; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--paper); color: var(--muted); border: 1px solid var(--line); }
.pill.going { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.done { background: var(--good-soft); color: var(--good); border-color: transparent; }
.bar { height: 6px; background: var(--paper); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--accent); }
.secs { display: flex; gap: 6px; flex-wrap: wrap; }
.secs span { font-size: 12px; color: var(--muted); }

/* test view */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; }
.tab { white-space: nowrap; border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 6px 12px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.tab[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tab small { color: var(--muted); font-weight: 500; }
.testlayout { display: grid; grid-template-columns: 220px 1fr; gap: 20px; align-items: start; padding-bottom: 48px; }
@media (max-width: 860px) { .testlayout { grid-template-columns: 1fr; } }
.navgrid { position: sticky; top: 120px; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
@media (max-width: 860px) { .navgrid { position: static; } }
.navgrid .cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 5px; margin-top: 8px; }
.cell { height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cell.ok { background: var(--good-soft); color: var(--good); border-color: transparent; }
.cell.no { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.cell.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

.qcard { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.qhead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.qbody { display: grid; gap: 20px; }
.qbody.split { grid-template-columns: 1fr 1fr; }
@media (max-width: 980px) { .qbody.split { grid-template-columns: 1fr; } }
.passage { font-family: var(--reading); font-size: 16px; line-height: 1.65; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.qbody.split .passage { max-height: 72vh; overflow-y: auto; }
.passage p { margin: 0; max-width: 70ch; }
.passage .h { font-family: var(--body); font-weight: 600; font-size: 13.5px; }
.passage u { text-decoration-thickness: 2px; text-underline-offset: 3px; background: var(--mark); padding: 0 2px; border-radius: 2px; }
.passage .tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); font-family: var(--body); }
.passage table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.passage td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: center; }
.passage tr:last-child td { border-bottom: 0; }
.passage td:first-child { text-align: left; font-weight: 600; white-space: nowrap; }
.passage tr:first-child { background: var(--paper); }
.prompt { font-size: 16.5px; line-height: 1.55; font-weight: 500; white-space: pre-line; margin: 0 0 14px; max-width: 70ch; }
.choices { display: grid; gap: 8px; }
.choice { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--sheet); border-radius: 10px; padding: 10px 12px; cursor: pointer; font-size: 15.5px; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice .let { flex: none; width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.choice.sel { border-color: var(--accent); background: var(--accent-soft); }
.choice.sel .let { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.right .let { background: var(--good); border-color: var(--good); color: var(--sheet); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.wrong .let { background: var(--bad); border-color: var(--bad); color: var(--sheet); }
.choice:disabled { cursor: default; }
.feedback { margin-top: 14px; border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.feedback.ok { background: var(--good-soft); }
.feedback.no { background: var(--bad-soft); }
.feedback strong.v { font-size: 15px; }
.feedback.ok strong.v { color: var(--good); }
.feedback.no strong.v { color: var(--bad); }
.feedback p { margin: 0; max-width: 72ch; }
.qfoot { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--muted); margin-top: 10px; }

/* results */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 16px 0 24px; }
.tile { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.tile b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.panel h2 { font-size: 16px; margin-bottom: 4px; }
.rows { display: grid; gap: 8px; margin-top: 12px; }
.r { display: grid; grid-template-columns: minmax(130px, 1.4fr) 2fr 92px; gap: 12px; align-items: center; }
@media (max-width: 560px) { .r { grid-template-columns: 1fr 70px; } .r .bar { grid-column: 1 / -1; grid-row: 2; } }
.r .lbl { font-size: 14px; }
.r .lbl small { display: block; color: var(--muted); font-size: 12px; }
.r .val { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
.bar.score > i { background: var(--good); }
.bar.score.mid > i { background: var(--accent); }
.bar.score.low > i { background: var(--bad); }
.picker { display: flex; gap: 6px; flex-wrap: wrap; }
.missed { display: grid; gap: 6px; margin-top: 10px; }
.missed button { text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.empty { padding: 28px; text-align: center; color: var(--muted); }

/* dialog */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 22, .45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.dialog { background: var(--sheet); border-radius: 14px; padding: 20px; max-width: 420px; width: 100%; border: 1px solid var(--line); }
.dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.sprbox { display: grid; gap: 6px; max-width: 320px; }
.sprbox input { font-size: 18px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); font-variant-numeric: tabular-nums; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 30; }
@media (prefers-reduced-motion: no-preference) { .choice, .cell, .btn { transition: border-color .12s, background .12s; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">SAT &amp; ACT Practice Tests</div>
    <nav class="nav" aria-label="Main">
      <a href="#tests" id="navTests">Tests</a>
      <a href="#results" id="navResults">My results</a>
    </nav>
  </div>
</header>
<main id="app"><div class="wrap page"><p class="muted">Loading tests…</p></div></main>

<script>
"use strict";
const L = "ABCDE";
function letter(q, i, qnum) { return q.exam === "ACT" && qnum % 2 === 0 ? "FGHJK"[i] : L[i]; }
const S = { tests: [], q: {}, skills: {}, progress: {}, view: { testId: null, sec: 0, idx: 0 }, sel: null, resultsFor: "all" };
const $app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------------- storage (this browser) ---------------- */
const LS_KEY = "practice-tests-progress-v1";
function lsLoad() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch { return {}; } }
function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify(S.progress)); } catch { toast("Couldn't save — is private browsing on?"); } }
function prog(testId) {
  return (S.progress[testId] ||= { answers: {}, last: null, startedAt: null, finishedAt: null });
}
function persist() { lsSave(); }

/* ---------------- helpers ---------------- */
function toast(t) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = t; document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}
function testById(id) { return S.tests.find((t) => t.id === id); }
function allIds(t) { return t.sections.flatMap((s) => s.questionIds); }
function stats(t) {
  const p = prog(t.id); const ids = allIds(t);
  let answered = 0, correct = 0;
  for (const id of ids) { const a = p.answers[id]; if (a) { answered++; if (a[1]) correct++; } }
  return { total: ids.length, answered, correct };
}
function pct(n, d) { return d ? Math.round((n / d) * 100) : 0; }

/* Scaled scores. The curve is modeled on published practice-test conversion tables, so it's an estimate. */
const CURVE = {
  SAT: [[0, 200], [0.1, 270], [0.2, 330], [0.3, 390], [0.4, 450], [0.5, 510], [0.6, 560], [0.7, 610], [0.8, 660], [0.9, 720], [0.95, 760], [1, 800]],
  ACT: [[0, 1], [0.1, 6], [0.2, 10], [0.3, 13], [0.4, 16], [0.5, 19], [0.6, 22], [0.7, 25], [0.8, 28], [0.9, 31], [0.95, 33], [1, 36]],
};
function scale(exam, f) {
  const c = CURVE[exam];
  for (let i = 1; i < c.length; i++) if (f <= c[i][0]) {
    const [x0, y0] = c[i - 1], [x1, y1] = c[i]; const y = y0 + ((f - x0) / (x1 - x0)) * (y1 - y0);
    return exam === "SAT" ? Math.round(y / 10) * 10 : Math.round(y);
  }
  return c[c.length - 1][1];
}
function roughScores(t) {
  const p = prog(t.id); const out = []; const subj = {};
  for (const s of t.sections) {
    const k = s.subject; subj[k] ||= { c: 0, n: 0, a: 0 };
    for (const id of s.questionIds) { subj[k].n++; const a = p.answers[id]; if (a) { subj[k].a++; if (a[1]) subj[k].c++; } }
  }
  for (const [k, v] of Object.entries(subj)) {
    if (v.a < v.n) { out.push({ k, done: false, v }); continue; }
    out.push({ k, done: true, score: scale(t.exam, v.c / v.n), v });
  }
  const got = (k) => out.find((o) => o.k === k && o.done)?.score;
  let total = null, extra = null;
  if (t.exam === "SAT") { if (got("Reading and Writing") && got("Math")) total = got("Reading and Writing") + got("Math"); }
  else {
    const e = got("English"), m = got("Math"), r = got("Reading"), sc = got("Science");
    if (e && m && r) total = Math.round((e + m + r) / 3);
    if (m && sc) extra = { label: "STEM (Math + Science)", value: Math.round((m + sc) / 2) };
  }
  return { out, total, extra };
}

/* ---------------- passage rendering ---------------- */
function inline(text) {
  // __text__ marks an underlined portion; a run of underscores (a blank) is left as is.
  return esc(text).replace(/__([^_\n][^\n]*?)__/g, '<u data-active="">$1</u>');
}
function isHeading(t) {
  t = t.trim();
  return /^(Passage [IVX]+|Table \d|Figure \d|Experiment \d|Study \d|Scientist \d|Text \d)/.test(t) ||
    (t.length < 60 && !/[.?!:"”)]$/.test(t) && !t.startsWith("•"));
}
function renderPassage(text) {
  const blocks = [];
  for (const line of text.split("\n")) {
    if (line.includes(" | ")) {
      const i = line.indexOf(":");
      const head = i >= 0 ? line.slice(0, i) : ""; const rest = i >= 0 ? line.slice(i + 1) : line;
      const cells = [head.trim(), ...rest.split("|").map((c) => c.trim())].filter((c, j) => j > 0 || c);
      const last = blocks[blocks.length - 1];
      if (last && last.t === "table") last.rows.push(cells); else blocks.push({ t: "table", rows: [cells] });
    } else if (line.trim()) blocks.push({ t: isHeading(line) ? "h" : "p", text: line });
  }
  return blocks.map((b) => b.t === "table"
    ? `<div class="tbl"><table><tbody>${b.rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`
    : `<p class="${b.t === "h" ? "h" : ""}">${inline(b.text)}</p>`).join("");
}

/* ---------------- views ---------------- */
function route() {
  const h = (location.hash || "#tests").slice(1);
  document.getElementById("navTests").setAttribute("aria-current", h === "tests" || testById(h) ? "page" : "false");
  document.getElementById("navResults").setAttribute("aria-current", h === "results" ? "page" : "false");
  if (h === "results") return renderResults();
  const t = testById(h);
  if (t) return openTest(t);
  renderHome();
}

function renderHome() {
  S.view.testId = null;
  const col = (exam, fmt) => {
    const ts = S.tests.filter((t) => t.exam === exam);
    return `<section class="examcol"><h2>${exam}</h2><p class="fmt muted small">${fmt}</p><div class="cards">${ts.map(card).join("")}</div></section>`;
  };
  $app.innerHTML = `<div class="wrap page">

    <div class="examgrid">
      ${col("SAT", "Reading and Writing 27 + 27 · Math 22 + 22")}
      ${col("ACT", "English 50 · Math 45 · Reading 36 · Science 40")}
    </div>
    <p class="muted small" style="margin-top:28px">Want the official College Board and ACT tests too? <a href="official.html">Official practice tests</a></p>
  </div>`;
}
function card(t) {
  const s = stats(t); const p = prog(t.id);
  const status = p.finishedAt ? ["done", "Finished"] : s.answered ? ["going", "In progress"] : ["", "Not started"];
  const subj = {};
  t.sections.forEach((x) => (subj[x.subject] = (subj[x.subject] || 0) + x.questionIds.length));
  return `<article class="card">
    <div class="row"><h3>${esc(t.name)}</h3><span class="pill ${status[0]}">${status[1]}</span></div>
    <div class="secs">${Object.entries(subj).map(([k, n]) => `<span>${esc(k)} ${n}</span>`).join('<span aria-hidden="true">·</span>')}</div>
    <div class="bar" role="progressbar" aria-label="Answered" aria-valuenow="${s.answered}" aria-valuemax="${s.total}"><i style="width:${pct(s.answered, s.total)}%"></i></div>
    <div class="row">
      <span class="muted small num" style="margin-right:auto">${s.answered} of ${s.total} answered${s.answered ? ` · ${s.correct} correct (${pct(s.correct, s.answered)}%)` : ""}</span>
      ${s.answered ? `<button class="btn ghost" onclick="S.resultsFor='${t.id}';location.hash='results'">Results</button>` : ""}
      <a class="btn primary" style="text-decoration:none" href="#${t.id}">${s.answered ? (p.finishedAt ? "Review" : "Continue") : "Start"}</a>
    </div>
  </article>`;
}

function openTest(t) {
  const p = prog(t.id);
  if (S.view.testId !== t.id) {
    S.view.testId = t.id; S.sel = null;
    const [si, qi] = (p.last || "0:0").split(":").map(Number);
    S.view.sec = Math.min(si || 0, t.sections.length - 1);
    S.view.idx = Math.min(qi || 0, t.sections[S.view.sec].questionIds.length - 1);
  }
  renderTest();
}
function cur() {
  const t = testById(S.view.testId); const sec = t.sections[S.view.sec];
  const id = sec.questionIds[S.view.idx];
  return { t, sec, id, q: S.q[id], a: prog(t.id).answers[id] };
}
function go(sec, idx) {
  const t = testById(S.view.testId);
  S.view.sec = sec; S.view.idx = idx; S.sel = null;
  const p = prog(t.id); p.last = sec + ":" + idx;
  lsSave();
  renderTest();
  window.scrollTo({ top: 0 });
}
function step(d) {
  const { t } = cur(); let s = S.view.sec, i = S.view.idx + d;
  if (i < 0) { if (s === 0) return; s--; i = t.sections[s].questionIds.length - 1; }
  else if (i >= t.sections[s].questionIds.length) { if (s === t.sections.length - 1) return; s++; i = 0; }
  go(s, i);
}

function renderTest() {
  const { t, sec, id, q, a } = cur();
  const p = prog(t.id); const st = stats(t);
  const tabs = t.sections.map((s, i) => {
    const done = s.questionIds.filter((x) => p.answers[x]).length;
    return `<button class="tab" role="tab" aria-selected="${i === S.view.sec}" onclick="go(${i},0)">${esc(s.name)} <small class="num">${done}/${s.questionIds.length}</small></button>`;
  }).join("");
  const cells = sec.questionIds.map((qid, i) => {
    const ans = p.answers[qid];
    const cls = ans ? (ans[1] ? "ok" : "no") : "";
    return `<button class="cell ${cls} ${i === S.view.idx ? "cur" : ""}" onclick="go(${S.view.sec},${i})" aria-label="Question ${i + 1}${ans ? (ans[1] ? ", correct" : ", incorrect") : ""}">${i + 1}</button>`;
  }).join("");
  const locked = !!a; const chosen = locked ? a[0] : S.sel;
  const split = (q.passage || "").length > 700;
  const qnum = S.view.idx + 1;
  const choices = q.spr
    ? (locked
      ? `<div class="sprbox"><span class="muted small">Your answer</span> <b class="num">${esc(a[0])}</b></div>`
      : `<div class="sprbox"><label class="small muted" for="sprIn">Type your answer (a number, fraction like 3/4, or decimal)</label>
          <input id="sprIn" type="text" inputmode="decimal" autocomplete="off" value="${esc(S.sel ?? "")}" oninput="S.sel=this.value.trim()||null;document.getElementById('submitBtn').disabled=!S.sel"></div>`)
    : q.choices.map((c, i) => {
    let cls = "";
    if (locked) { if (i === q.answer) cls = "right"; else if (i === chosen) cls = "wrong"; }
    else if (i === chosen) cls = "sel";
    return `<button class="choice ${cls}" ${locked ? "disabled" : ""} onclick="pick(${i})" aria-pressed="${i === chosen}"><span class="let">${letter(q, i, qnum)}</span><span>${esc(c)}</span></button>`;
  }).join("");
  let fb = "";
  if (locked) {
    const ok = a[1];
    const note = !ok && !q.spr && q.notes && q.notes[String(a[0])];
    const right = q.spr ? q.sprAnswer : letter(q, q.answer, qnum);
    fb = `<div class="feedback ${ok ? "ok" : "no"}" aria-live="polite">
      <strong class="v">${ok ? "Correct" : `Incorrect — the answer is ${esc(right)}`}</strong>
      ${note ? `<p><b>Why ${letter(q, a[0], qnum)} is tempting:</b> ${esc(note)}</p>` : ""}
      <p>${esc(q.explanation)}</p>
    </div>`;
  }
  const isLast = S.view.sec === t.sections.length - 1 && S.view.idx === sec.questionIds.length - 1;
  const skill = S.skills[q.skill];
  $app.innerHTML = `<div class="wrap">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:14px">
      <a href="#tests" class="btn ghost" style="text-decoration:none">← All tests</a>
      <h1 style="font-size:19px;margin-right:auto">${esc(t.name)}</h1>
      <span class="muted small num">${st.answered}/${st.total} answered · ${st.correct} correct</span>
      <button class="btn" onclick="S.resultsFor='${t.id}';location.hash='results'">Results</button>
    </div>
    <div class="tabs" role="tablist" aria-label="Sections">${tabs}</div>
    <div class="testlayout">
      <aside class="navgrid" aria-label="Questions in this section">
        <div class="small muted">${esc(sec.name)}</div>
        <div class="cells">${cells}</div>
        <div class="legend"><span><i style="background:var(--good-soft)"></i>Correct</span><span><i style="background:var(--bad-soft)"></i>Incorrect</span><span><i style="border:1px solid var(--line)"></i>Open</span></div>
      </aside>
      <section class="qcard" aria-label="Question">
        <div class="qhead">
          <span class="small"><b class="num">Question ${S.view.idx + 1}</b> <span class="muted">of ${sec.questionIds.length} · ${esc(sec.name)}</span></span>
          <span class="small muted">${skill ? esc(skill.domain) : ""} · ${["Easy", "Medium", "Hard"][q.difficulty - 1]}</span>
        </div>
        <div class="qbody ${split ? "split" : ""}">
          ${q.passage ? `<div class="passage" id="passage">${renderPassage(q.passage)}</div>` : ""}
          <div>
            <p class="prompt">${esc(q.prompt)}</p>
            <div class="choices" role="group" aria-label="Answer choices">${choices}</div>
            ${fb}
            <div class="qfoot">
              <button class="btn" onclick="step(-1)" ${S.view.sec === 0 && S.view.idx === 0 ? "disabled" : ""}>← Previous</button>
              <div style="display:flex;gap:8px">
                ${locked ? "" : `<button class="btn primary" id="submitBtn" onclick="submitAnswer()" ${chosen == null ? "disabled" : ""}>Submit answer</button>`}
                ${isLast ? `<button class="btn ${locked ? "primary" : ""}" onclick="finishTest()">Finish test</button>` : `<button class="btn ${locked ? "primary" : ""}" onclick="step(1)">Next →</button>`}
              </div>
            </div>
            <p class="hint">${q.spr ? "Enter submits" : "Keys: A–D choose · Enter submit · ← → move"}</p>
          </div>
        </div>
      </section>
    </div>
  </div>`;
  const box = document.getElementById("passage"); const act = box && box.querySelector("[data-active]");
  if (box && act && split) box.scrollTop = Math.max(0, act.offsetTop - box.clientHeight / 3);
}
function pick(i) { if (cur().a) return; S.sel = i; renderTest(); }
function submitAnswer() {
  const { t, id, q, a } = cur();
  if (a || S.sel == null) return;
  const p = prog(t.id);
  p.startedAt ||= new Date().toISOString();
  p.answers[id] = [S.sel, (q.spr ? sprMatch(S.sel, q.sprAnswer) : S.sel === q.answer) ? 1 : 0, Date.now()];
  p.last = S.view.sec + ":" + S.view.idx;
  S.sel = null;
  persist(t.id);
  renderTest();
}
function toNum(s) {
  s = String(s).trim().replace(/[−–]/g, "-").replace(/^\+/, "");
  if (/^-?\d+\/\d+$/.test(s)) { const [a, b] = s.split("/").map(Number); return b ? a / b : NaN; }
  return /^-?(\d+\.?\d*|\.\d+)$/.test(s) ? Number(s) : NaN;
}
/* Same rules as the SAT: any equivalent form counts (3/4, .75, 0.75); long decimals may be cut off or rounded. */
function sprMatch(given, correct) {
  const g = toNum(given), c = toNum(correct);
  if (isNaN(g) || isNaN(c)) return String(given).trim() === String(correct).trim();
  return Math.abs(g - c) < 1e-9 || (!Number.isInteger(c) && Math.abs(g - c) < 0.001);
}
function finishTest() {
  const { t } = cur(); const p = prog(t.id); const s = stats(t);
  const doIt = () => { p.finishedAt = new Date().toISOString(); persist(t.id); S.resultsFor = t.id; location.hash = "results"; };
  if (s.answered < s.total) confirmBox(`You've answered ${s.answered} of ${s.total}. Finish anyway? You can still come back and answer the rest.`, "Finish test", doIt);
  else doIt();
}
function confirmBox(msg, ok, fn) {
  const el = document.createElement("div");
  el.className = "scrim";
  el.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><p style="margin:0">${esc(msg)}</p><div class="row"><button class="btn" id="cNo">Cancel</button><button class="btn primary" id="cYes">${esc(ok)}</button></div></div>`;
  document.body.appendChild(el);
  el.querySelector("#cNo").onclick = () => el.remove();
  el.querySelector("#cYes").onclick = () => { el.remove(); fn(); };
  el.querySelector("#cYes").focus();
}
document.addEventListener("keydown", (e) => {
  if (!S.view.testId || !testById((location.hash || "").slice(1)) || document.querySelector(".scrim")) return;
  const k = e.key.toLowerCase();
  const { q, a } = cur();
  if (e.target && e.target.tagName === "INPUT") { if (k === "enter" && !a && S.sel != null) { e.preventDefault(); submitAnswer(); } return; }
  const i = "abcde".indexOf(k);
  if (i >= 0 && i < q.choices.length && !a && !e.metaKey && !e.ctrlKey) { e.preventDefault(); pick(i); }
  else if (k === "enter") { e.preventDefault(); if (!a && S.sel != null) submitAnswer(); else if (a) step(1); }
  else if (k === "arrowright") step(1);
  else if (k === "arrowleft") step(-1);
});

/* ---------------- results ---------------- */
function tally(entries) {
  const m = {};
  for (const [key, ok] of entries) { m[key] ||= { c: 0, n: 0 }; m[key].n++; if (ok) m[key].c++; }
  return m;
}
function rowsHtml(m, label, sortWeakFirst) {
  let rows = Object.entries(m);
  if (sortWeakFirst) rows.sort((a, b) => a[1].c / a[1].n - b[1].c / b[1].n || b[1].n - a[1].n);
  return rows.map(([k, v]) => {
    const f = v.c / v.n; const cls = f >= 0.75 ? "" : f >= 0.5 ? "mid" : "low";
    return `<div class="r"><div class="lbl">${label(k)}</div><div class="bar score ${cls}"><i style="width:${pct(v.c, v.n)}%"></i></div><div class="val">${v.c}/${v.n} · ${pct(v.c, v.n)}%</div></div>`;
  }).join("");
}
function renderResults() {
  S.view.testId = null;
  const started = S.tests.filter((t) => stats(t).answered > 0);
  const opts = [["all", "All tests"], ...S.tests.map((t) => [t.id, t.name])];
  const chosen = S.resultsFor === "all" ? S.tests : [testById(S.resultsFor)].filter(Boolean);
  const answered = [];
  for (const t of chosen) {
    const p = prog(t.id);
    for (const s of t.sections) for (const id of s.questionIds) { const a = p.answers[id]; if (a) answered.push({ t, s, q: S.q[id], ok: !!a[1], a }); }
  }
  const picker = `<div class="picker">${opts.map(([id, n]) => `<button class="btn ${S.resultsFor === id ? "primary" : ""}" onclick="S.resultsFor='${id}';renderResults()">${esc(n)}</button>`).join("")}</div>`;
  if (!answered.length) {
    $app.innerHTML = `<div class="wrap page"><h1>My results</h1><p class="lede muted">Results appear here as you submit answers.</p>${picker}<div class="panel empty" style="margin-top:16px">${started.length ? "No answers in this test yet." : "No answers yet. Start a test and submit a few answers."}</div></div>`;
    return;
  }
  const c = answered.filter((x) => x.ok).length;
  const bySubject = tally(answered.map((x) => [`${x.q.exam} ${x.s.subject}`, x.ok]));
  const bySkill = tally(answered.map((x) => [x.q.skill, x.ok]));
  const byDiff = tally(answered.map((x) => [["Easy", "Medium", "Hard"][x.q.difficulty - 1], x.ok]));
  const weakest = Object.entries(bySkill).filter(([, v]) => v.n >= 3).sort((a, b) => a[1].c / a[1].n - b[1].c / b[1].n).slice(0, 3);
  const strongest = Object.entries(bySkill).filter(([, v]) => v.n >= 3).sort((a, b) => b[1].c / b[1].n - a[1].c / a[1].n).slice(0, 3);
  const skillLabel = (k) => { const s = S.skills[k]; return s ? `${esc(s.domain)}<small>${esc(s.exam)} ${esc(s.section)} · ${esc(s.name)}</small>` : esc(k); };
  let est = "";
  if (S.resultsFor !== "all") {
    const t = chosen[0]; const r = roughScores(t);
    est = `<div class="panel"><h2>Scaled scores</h2><p class="muted small" style="margin:0">Each section is scored when every question in it is answered. The scale follows a curve modeled on official practice tests, so treat it as an estimate.</p>
      <div class="rows">${r.out.map((o) => `<div class="r"><div class="lbl">${esc(o.k)}</div><div class="muted small">${o.done ? `${o.v.c}/${o.v.n} correct` : `${o.v.a}/${o.v.n} answered`}</div><div class="val"><b>${o.done ? o.score : "—"}</b></div></div>`).join("")}
      <div class="r"><div class="lbl"><b>${t.exam === "SAT" ? "Total (400–1600)" : "Composite (1–36: English, Math, Reading)"}</b></div><div class="muted small">${r.total == null ? "Finish those sections to see this" : ""}</div><div class="val"><b>${r.total ?? "—"}</b></div></div>
      ${r.extra ? `<div class="r"><div class="lbl">${r.extra.label}</div><div></div><div class="val"><b>${r.extra.value}</b></div></div>` : ""}</div></div>`;
  }
  const missed = answered.filter((x) => !x.ok).slice(-12).reverse();
  $app.innerHTML = `<div class="wrap page">
    <h1>My results</h1>
    <p class="lede muted">Built only from answers you've submitted.</p>
    ${picker}
    <div class="tiles">
      <div class="tile"><span class="muted small">Answered</span><b>${answered.length}</b></div>
      <div class="tile"><span class="muted small">Correct</span><b>${c}</b></div>
      <div class="tile"><span class="muted small">Accuracy</span><b>${pct(c, answered.length)}%</b></div>
      ${weakest[0] ? `<div class="tile"><span class="muted small">Weakest area</span><b style="font-size:16px">${esc(S.skills[weakest[0][0]]?.domain || weakest[0][0])}</b><span class="small muted">${pct(weakest[0][1].c, weakest[0][1].n)}% of ${weakest[0][1].n}</span></div>` : ""}
      ${strongest[0] ? `<div class="tile"><span class="muted small">Strongest area</span><b style="font-size:16px">${esc(S.skills[strongest[0][0]]?.domain || strongest[0][0])}</b><span class="small muted">${pct(strongest[0][1].c, strongest[0][1].n)}% of ${strongest[0][1].n}</span></div>` : ""}
    </div>
    ${est}
    <div class="panel"><h2>By section</h2><div class="rows">${rowsHtml(bySubject, esc, false)}</div></div>
    <div class="panel"><h2>By skill, weakest first</h2><p class="muted small" style="margin:0">Skills with fewer than 3 answers are less reliable.</p><div class="rows">${rowsHtml(bySkill, skillLabel, true)}</div></div>
    <div class="panel"><h2>By difficulty</h2><div class="rows">${rowsHtml(byDiff, esc, false)}</div></div>
    ${missed.length ? `<div class="panel"><h2>Recently missed</h2><div class="missed">${missed.map((x) => {
      const si = x.t.sections.indexOf(x.s); const qi = x.s.questionIds.indexOf(x.q.id);
      return `<button onclick="jump('${x.t.id}',${si},${qi})"><b>${esc(x.t.name)}</b> · ${esc(x.s.name)} #${qi + 1} — <span class="muted">${(() => { const t = (x.q.exam === "SAT" && x.q.passage ? x.q.passage : x.q.prompt).replace(/__/g, ""); return esc(t.slice(0, 90)) + (t.length > 90 ? "…" : ""); })()}</span></button>`;
    }).join("")}</div></div>` : ""}
    ${S.resultsFor !== "all" ? `<div style="margin-top:8px"><button class="btn danger" onclick="resetTest('${S.resultsFor}')">Clear my answers for this test</button></div>` : ""}
  </div>`;
}
function jump(testId, si, qi) {
  S.view.testId = testId; S.view.sec = si; S.view.idx = qi; S.sel = null;
  prog(testId).last = si + ":" + qi;
  location.hash = testId;
}
function resetTest(id) {
  const t = testById(id);
  confirmBox(`Clear every answer in ${t.name}? This can't be undone.`, "Clear answers", () => {
    S.progress[id] = { answers: {}, last: null, startedAt: null, finishedAt: null };
    persist(id); toast("Answers cleared"); renderResults();
  });
}

/* ---------------- boot ---------------- */
(async function boot() {
  try {
    const res = await fetch("tests.json");
    const data = await res.json();
    S.tests = data.tests; S.q = data.questions; S.skills = data.skills;
  } catch (e) {
    $app.innerHTML = `<div class="wrap page"><p>Couldn't load the tests. Reload the page to try again.</p></div>`;
    return;
  }
  S.progress = lsLoad();
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
