<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Official SAT & ACT Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* An answer sheet that sits next to the official test PDF: one row of bubbles per question,
   each row locked in on its own, nothing timed, every section open. */
:root {
  --paper: #f5f6f8; --sheet: #ffffff; --ink: #1b2433; --muted: #5f6b7d; --line: #dde2ea;
  --accent: #2446a8; --accent-soft: #e8edfb; --good: #1d7a4a; --good-soft: #e3f4ea;
  --bad: #b3322b; --bad-soft: #fbe7e5; --warn: #8a5a00; --warn-soft: #fff4d6;
  --font: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12161d; --sheet: #1a2029; --ink: #e6eaf1; --muted: #9aa5b6; --line: #2c3442;
    --accent: #8fa8ff; --accent-soft: #232c45; --good: #5fd08f; --good-soft: #17301f;
    --bad: #ff8a80; --bad-soft: #3a1e1c; --warn: #f2c35b; --warn-soft: #3a3018; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--font); }
button, input, textarea, select { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.top { position: sticky; top: 0; z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 54px; flex-wrap: wrap; }
.brand { font-weight: 700; margin-right: auto; }
.nav { display: flex; gap: 4px; }
.nav a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 8px; font-weight: 500; }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 7px 13px; cursor: pointer; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--bad); }
.page { padding: 26px 0 64px; }
.page h1 { font-size: 25px; }
.lede { max-width: 66ch; margin: 6px 0 22px; }
.cols { display: grid; gap: 28px; grid-template-columns: 1fr 1fr; }
@media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
.col h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
.col .fmt { margin: 0 0 12px; }
.cards { display: grid; gap: 10px; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card h3 { font-size: 15.5px; margin-right: auto; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--paper); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.going { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.done { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.bar { height: 6px; background: var(--paper); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--accent); }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.panel h2 { font-size: 16px; margin-bottom: 4px; }
.steps { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; max-width: 72ch; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; margin-top: 12px; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
textarea { width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--paper); font-size: 13px; }
select, input[type="text"], input[type="url"] { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--sheet); }
details summary { cursor: pointer; color: var(--accent); font-weight: 500; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 12px; }
.tab { white-space: nowrap; border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 6px 12px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.tab[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tab small { color: var(--muted); font-weight: 500; }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.q { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); min-height: 52px; }
.q:last-child { border-bottom: 0; }
.q .n { font-weight: 700; font-variant-numeric: tabular-nums; }
.q.ok { background: var(--good-soft); }
.q.no { background: var(--bad-soft); }
.bubbles { display: flex; gap: 6px; flex-wrap: wrap; }
.bub { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--sheet); cursor: pointer; font-weight: 600; font-size: 14px; }
.bub:hover:not(:disabled) { border-color: var(--accent); }
.bub.sel { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.bub.right { background: var(--good); border-color: var(--good); color: var(--sheet); }
.bub.wrong { background: var(--bad); border-color: var(--bad); color: var(--sheet); }
.bub:disabled { cursor: default; }
.spr { display: flex; gap: 8px; align-items: center; }
.spr input { width: 130px; }
.verdict { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.q.ok .verdict { color: var(--good); }
.q.no .verdict { color: var(--bad); }
@media (max-width: 560px) { .q { grid-template-columns: 34px 1fr; } .q .act { grid-column: 2; } .bub { width: 40px; height: 40px; } }
.rows { display: grid; gap: 8px; margin-top: 10px; }
.r { display: grid; grid-template-columns: minmax(150px, 1.2fr) 2fr 110px; gap: 12px; align-items: center; }
@media (max-width: 560px) { .r { grid-template-columns: 1fr 90px; } .r .bar { grid-column: 1 / -1; grid-row: 2; } }
.r .val { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
.bar.s > i { background: var(--good); } .bar.s.mid > i { background: var(--accent); } .bar.s.low > i { background: var(--bad); }
table.grid { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.grid th, table.grid td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: right; white-space: nowrap; }
table.grid th:first-child, table.grid td:first-child { text-align: left; }
table.grid th { font-weight: 600; color: var(--muted); font-size: 12.5px; }
.scroll { overflow-x: auto; }
.missed { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.missed button { border: 1px solid var(--line); background: var(--bad-soft); color: var(--bad); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-weight: 600; font-variant-numeric: tabular-nums; }
.picker { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 22, .45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.dialog { background: var(--sheet); border-radius: 14px; padding: 20px; max-width: 460px; width: 100%; border: 1px solid var(--line); display: grid; gap: 10px; }
.dialog label { display: grid; gap: 4px; font-size: 13.5px; font-weight: 500; }
.dialog .row { justify-content: flex-end; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 30; max-width: 90vw; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">Official Practice Tests</div>
  <nav class="nav" aria-label="Main"><a href="#home" id="navHome">Tests</a><a href="#results" id="navResults">My results</a></nav>
</div></header>
<main id="app"></main>

<script>
"use strict";
/* ---------- the official tests (links only — the questions stay on College Board's and ACT's sites) ---------- */
const CB = "https://satsuite.collegeboard.org/media/pdf/";
const SAT_PAGE = "https://satsuite.collegeboard.org/sat/practice-preparation/practice-tests/linear";
const ACT_PAGE = "https://www.act.org/content/act/en/products-and-services/the-act/test-preparation.html";
const FORMATS = {
  sat: { exam: "SAT", label: "Digital SAT", sections: [
    { name: "Reading and Writing — Module 1", subject: "Reading and Writing", n: 27, kind: "rw" },
    { name: "Reading and Writing — Module 2", subject: "Reading and Writing", n: 27, kind: "rw" },
    { name: "Math — Module 1", subject: "Math", n: 22, kind: "math" },
    { name: "Math — Module 2", subject: "Math", n: 22, kind: "math" } ] },
  act: { exam: "ACT", label: "ACT (2025 and later)", sections: [
    { name: "English", subject: "English", n: 50, kind: "act4" },
    { name: "Math", subject: "Math", n: 45, kind: "act4" },
    { name: "Reading", subject: "Reading", n: 36, kind: "act4" },
    { name: "Science", subject: "Science", n: 40, kind: "act4" } ] },
  actold: { exam: "ACT", label: "ACT (before 2025)", sections: [
    { name: "English", subject: "English", n: 75, kind: "act4" },
    { name: "Math", subject: "Math", n: 60, kind: "act5" },
    { name: "Reading", subject: "Reading", n: 40, kind: "act4" },
    { name: "Science", subject: "Science", n: 40, kind: "act4" } ] },
};
const BUILT_IN = [
  ...[4, 5, 6, 7, 8, 9, 10, 11].map((k) => ({
    id: "sat-" + k, name: "SAT Practice Test " + k, format: "sat",
    testUrl: CB + "sat-practice-test-" + k + "-digital.pdf",
    keyUrl: CB + "scoring-sat-practice-test-" + k + "-digital.pdf",
    keyHint: "Download the scoring file for this test. Its answer key lists every module.",
  })),
  { id: "act-1", name: "ACT Practice Test 1 (2025–26)", format: "act",
    testUrl: "https://www.act.org/content/dam/act/unsecured/documents/Preparing-for-the-ACT.pdf",
    keyHint: "The scoring keys are at the back of the same PDF, so load that whole PDF as the key." },
  { id: "act-2", name: "ACT Practice Test 2 (2025–26)", format: "act",
    testUrl: "https://www.act.org/content/dam/act/unsecured/documents/ACT-Test-Prep-ACT-Practice-Test-2-Form.pdf",
    keyHint: "The scoring keys are at the back of the same PDF, so load that whole PDF as the key." },
];

/* ---------- storage (this browser) ---------- */
const LS = "official-practice-v1";
let D = load();
function load() {
  try { const d = JSON.parse(localStorage.getItem(LS) || "null"); if (d && d.v === 1) return d; } catch {}
  return { v: 1, custom: [], keys: {}, answers: {}, last: {} };
}
function save() { try { localStorage.setItem(LS, JSON.stringify(D)); } catch { toast("Couldn't save — is private browsing on?"); } }
const tests = () => [...BUILT_IN, ...D.custom];
const testById = (id) => tests().find((t) => t.id === id);
const fmt = (t) => FORMATS[t.format];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 3200); }

/* ---------- answer letters ---------- */
function choicesFor(kind, q) {
  if (kind === "rw" || kind === "math") return ["A", "B", "C", "D"];
  const odd = q % 2 === 1;
  if (kind === "act5") return odd ? ["A", "B", "C", "D", "E"] : ["F", "G", "H", "J", "K"];
  return odd ? ["A", "B", "C", "D"] : ["F", "G", "H", "J"];
}
const NUMERIC = /^-?(\d+(\.\d+)?|\.\d+|\d+\/\d+|-?\d+\/\d+)$/;
function validAnswer(kind, q, tok) {
  if (choicesFor(kind, q).includes(tok)) return true;
  return kind === "math" && NUMERIC.test(tok);
}

/* ---------- reading an official answer key ---------- */
const cleanNum = (t) => { const m = /^(\d{1,3})[.:)]?$/.exec(t); return m ? Number(m[1]) : null; };
const cleanAns = (t) => t.replace(/^[(\[]/, "").replace(/[)\].;]$/, "");
const isLetterTok = (t) => /^[A-K]$/.test(cleanAns(t));
function tokenize(text) {
  return text.replace(/[−–—]/g, "-").replace(/(\d)\s*\/\s*(\d)/g, "$1/$2").split(/\s+/).filter(Boolean);
}
/* Read an answer at tokens[i]; for SAT math grid-ins, gather alternatives like "3/4, .75". */
function readAnswer(tokens, i, kind, q) {
  let t = cleanAns(tokens[i] || "");
  const trailingComma = t.endsWith(",");
  t = t.replace(/,$/, "");
  if (!validAnswer(kind, q, t)) return null;
  // a bubble sheet ("1 A B C D") is not an answer key
  if (isLetterTok(t) && tokens[i + 1] && isLetterTok(tokens[i + 1]) && cleanNum(tokens[i + 1]) === null) return null;
  const alts = [t]; let j = i + 1; let more = trailingComma;
  if (kind === "math" && NUMERIC.test(t)) {
    while (j < tokens.length) {
      let u = tokens[j];
      if (u === "or" || u === ",") { more = true; j++; continue; }
      if (!more) break;
      const c = u.replace(/,$/, "");
      if (!NUMERIC.test(c)) break;
      alts.push(c); more = u.endsWith(","); j++;
    }
  }
  return { value: alts.join(", "), next: j };
}
/* How many number+answer pairs a block of text has, and how many look like a real key. */
function pageScore(tokens, sections) {
  let pairs = 0, strong = 0;
  for (let i = 0; i < tokens.length - 1; i++) {
    const n = cleanNum(tokens[i]); if (!n) continue;
    const hit = sections.find((s) => n <= s.n && readAnswer(tokens, i + 1, s.kind, n));
    if (!hit) continue;
    pairs++;
    const a = cleanAns(tokens[i + 1]).replace(/,$/, "");
    if (/^[A-K]$/.test(a)) strong++;
  }
  return { pairs, strong };
}
/* Fill every section in order. Handles keys laid out section-by-section or as side-by-side columns. */
function parseKey(pages, sections) {
  const key = sections.map(() => []);
  const next = sections.map(() => 1);
  for (const text of pages) {
    const tokens = tokenize(text);
    for (let i = 0; i < tokens.length - 1; i++) {
      const n = cleanNum(tokens[i]); if (!n) continue;
      for (let s = 0; s < sections.length; s++) {
        if (next[s] !== n || n > sections[s].n) continue;
        const a = readAnswer(tokens, i + 1, sections[s].kind, n);
        if (!a) continue;
        key[s][n - 1] = a.value; next[s]++; i = a.next - 1; break;
      }
      if (next.every((v, s) => v > sections[s].n)) return key;
    }
  }
  return key;
}
function keyPages(pages, sections) {
  // keep only pages that look like an answer key: lots of number+letter pairs, not score-conversion tables or test pages
  // A short page right after a key page (the end of a table that ran over) is kept too.
  let prev = false;
  const keep = pages.filter((p) => {
    const sc = pageScore(tokenize(p), sections); const ratio = sc.pairs ? sc.strong / sc.pairs : 0;
    prev = (sc.pairs >= 8 && ratio >= 0.5) || (prev && sc.pairs >= 1 && ratio >= 0.8);
    return prev;
  });
  return keep.length ? keep : pages;
}
let pdfjs = null;
async function pdfText(file) {
  if (!pdfjs) {
    pdfjs = await import("./vendor/pdf.min.mjs");
    pdfjs.GlobalWorkerOptions.workerSrc = new URL("./vendor/pdf.worker.min.mjs", location.href).href;
  }
  const doc = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const pages = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const c = await (await doc.getPage(p)).getTextContent();
    pages.push(c.items.map((it) => it.str + (it.hasEOL ? "\n" : " ")).join(""));
  }
  return pages;
}
function keyCount(t) { const k = D.keys[t.id]; return k ? k.reduce((s, sec) => s + sec.filter(Boolean).length, 0) : 0; }
const totalQs = (t) => fmt(t).sections.reduce((s, x) => s + x.n, 0);
function keyReady(t) { return keyCount(t) === totalQs(t); }
function storeKey(t, parsed) {
  const secs = fmt(t).sections;
  const old = D.keys[t.id] || secs.map(() => []);
  // keep any section that was already complete if the new file missed it
  D.keys[t.id] = secs.map((s, i) => (parsed[i].filter(Boolean).length >= (old[i] || []).filter(Boolean).length ? parsed[i] : old[i]));
  save();
}

/* ---------- grading ---------- */
function toNum(s) {
  s = String(s).trim().replace(/^\+/, "");
  if (/^-?\d+\/\d+$/.test(s)) { const [a, b] = s.split("/").map(Number); return b ? a / b : NaN; }
  return /^-?(\d+\.?\d*|\.\d+)$/.test(s) ? Number(s) : NaN;
}
function isCorrect(given, correct) {
  if (/^[A-K]$/.test(correct)) return given === correct;
  const g = toNum(given);
  return correct.split(",").map((x) => x.trim()).some((c) => {
    if (c.replace(/^0(?=\.)/, "") === String(given).trim().replace(/^0(?=\.)/, "")) return true;
    const v = toNum(c);
    return !isNaN(g) && !isNaN(v) && (Math.abs(g - v) < 1e-9 || (!Number.isInteger(v) && Math.abs(g - v) < 0.001));
  });
}

/* ---------- stats ---------- */
function answersOf(t) { return (D.answers[t.id] ||= {}); }
function secStats(t, si) {
  const A = answersOf(t); let a = 0, c = 0;
  for (let q = 1; q <= fmt(t).sections[si].n; q++) { const x = A[si + ":" + q]; if (x) { a++; if (x.ok) c++; } }
  return { a, c, n: fmt(t).sections[si].n };
}
function testStats(t) {
  return fmt(t).sections.reduce((acc, _, i) => { const s = secStats(t, i); acc.a += s.a; acc.c += s.c; acc.n += s.n; return acc; }, { a: 0, c: 0, n: 0 });
}

/* ---------- routing ---------- */
const S = { sec: 0, sel: {}, resultsFor: "all" };
function route() {
  const h = (location.hash || "#home").slice(1);
  const [a, b] = h.split("/");
  document.getElementById("navHome").setAttribute("aria-current", a === "home" || a === "t" ? "page" : "false");
  document.getElementById("navResults").setAttribute("aria-current", a === "results" ? "page" : "false");
  if (a === "t" && testById(b)) return renderTest(testById(b));
  if (a === "results") { if (b && testById(b)) S.resultsFor = b; return renderResults(); }
  renderHome();
}
window.addEventListener("hashchange", () => { route(); window.scrollTo({ top: 0 }); });

/* ---------- home ---------- */
function renderHome() {
  const col = (exam, fmtText) => `<section class="col"><h2>${exam}</h2><p class="fmt muted small">${fmtText}</p>
    <div class="cards">${tests().filter((t) => fmt(t).exam === exam).map(card).join("")}</div>
    ${exam === "ACT" ? `<div style="margin-top:10px"><button class="btn" onclick="addTestDialog()">+ Add a test</button></div>` : ""}</section>`;
  document.getElementById("app").innerHTML = `<div class="wrap page">
    <h1>Official SAT &amp; ACT practice tests</h1>
    <p class="lede muted">Open the official test PDF next to this page and fill in the answer sheet. No timer, every section open, and each answer is checked only when you submit it. Your answers save after every submit.</p>
    <div class="cols">
      ${col("SAT", "College Board's 8 official full-length tests · Reading and Writing 27 + 27, Math 22 + 22")}
      ${col("ACT", "ACT's free official tests · English 50, Math 45, Reading 36, Science 40")}
    </div>
    <p class="muted small" style="margin-top:28px;max-width:72ch">The tests and answer keys belong to College Board and ACT and stay on their websites. An answer key you load is read on this device and saved only in this browser.</p>
  </div>`;
}
function card(t) {
  const st = testStats(t); const ready = keyReady(t);
  const status = !ready ? ["warn", "Needs answer key"] : st.a === st.n ? ["done", "Finished"] : st.a ? ["going", "In progress"] : ["", "Not started"];
  return `<article class="card">
    <div class="row"><h3>${esc(t.name)}</h3><span class="pill ${status[0]}">${status[1]}</span></div>
    <div class="bar" role="progressbar" aria-label="Answered" aria-valuenow="${st.a}" aria-valuemax="${st.n}"><i style="width:${pct(st.a, st.n)}%"></i></div>
    <div class="row"><span class="muted small num" style="margin-right:auto">${st.a} of ${st.n} answered${st.a ? ` · ${st.c} correct (${pct(st.c, st.a)}%)` : ""}</span>
      ${st.a ? `<a class="btn ghost" href="#results/${t.id}">Results</a>` : ""}
      <a class="btn primary" href="#t/${t.id}">${st.a ? "Continue" : "Open"}</a></div>
  </article>`;
}

/* ---------- a test ---------- */
function renderTest(t) {
  const F = fmt(t); const ready = keyReady(t); const kc = keyCount(t);
  if (S.testId !== t.id) { S.testId = t.id; S.sel = {}; S.sec = (D.last[t.id] ?? 0); }
  S.sec = Math.min(S.sec, F.sections.length - 1);
  const st = testStats(t);
  const links = `<div class="row" style="gap:8px">
      ${t.testUrl ? `<a class="btn primary" href="${esc(t.testUrl)}" target="_blank" rel="noopener">Open test PDF ↗</a>` : ""}
      ${t.keyUrl ? `<a class="btn" href="${esc(t.keyUrl)}" target="_blank" rel="noopener">Answer key PDF ↗</a>` : ""}
      ${!t.testUrl ? `<a class="btn" href="${F.exam === "SAT" ? SAT_PAGE : ACT_PAGE}" target="_blank" rel="noopener">Official practice page ↗</a>` : ""}
    </div>`;
  const keyPanel = `<div class="panel" id="keyPanel">
      <h2>${ready ? "Answer key loaded" : kc ? `Answer key: ${kc} of ${totalQs(t)} answers found` : "Load the answer key first"}</h2>
      ${ready ? `<p class="muted small" style="margin:0">All ${totalQs(t)} answers are ready. They stay hidden until you submit each question.</p>` : `
      <ol class="steps">
        <li>Download the official ${t.keyUrl ? "answer key" : "test"} PDF${t.keyUrl || t.testUrl ? ` with the button${t.keyUrl ? " “Answer key PDF”" : " “Open test PDF”"} above` : ""}. ${esc(t.keyHint || "Use the official PDF that contains the scoring key.")}</li>
        <li>Drop that PDF here or choose it. This page reads the answers from the file without showing them to you.</li>
      </ol>
      <div class="drop" id="drop"><p style="margin:0 0 8px">Drop the PDF here</p>
        <label class="btn primary">Choose PDF<input type="file" accept="application/pdf,.pdf" id="keyFile" hidden></label></div>
      ${kc ? `<p class="small" style="margin:10px 0 0">${F.sections.map((s, i) => `${esc(s.name)}: ${(D.keys[t.id][i] || []).filter(Boolean).length}/${s.n}`).join(" · ")}</p>` : ""}
      <details style="margin-top:12px"><summary>The PDF didn't work? Paste the key text instead</summary>
        <p class="small muted">Open the answer key in the PDF, select the table for one section, copy, and paste it here. Choose the section first.</p>
        <div class="row" style="margin-bottom:8px"><select id="pasteSec">${F.sections.map((s, i) => `<option value="${i}">${esc(s.name)}</option>`).join("")}</select></div>
        <textarea id="pasteText" placeholder="Paste the copied answer key text"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn" onclick="pasteKey('${t.id}')">Read pasted key</button></div>
      </details>`}
    </div>`;
  let body = "";
  if (ready) {
    const tabs = F.sections.map((s, i) => { const x = secStats(t, i); return `<button class="tab" role="tab" aria-selected="${i === S.sec}" onclick="setSec(${i})">${esc(s.name)} <small class="num">${x.a}/${x.n}</small></button>`; }).join("");
    const sec = F.sections[S.sec]; const A = answersOf(t); const key = D.keys[t.id][S.sec];
    const rows = [];
    for (let q = 1; q <= sec.n; q++) rows.push(qRow(t, sec, q, A[S.sec + ":" + q], key[q - 1]));
    body = `<div class="tabs" role="tablist" aria-label="Sections">${tabs}</div>
      <div class="sheet" aria-label="${esc(sec.name)} answer sheet">${rows.join("")}</div>
      <div class="row" style="margin-top:14px">
        ${S.sec > 0 ? `<button class="btn" onclick="setSec(${S.sec - 1})">← ${esc(F.sections[S.sec - 1].name)}</button>` : ""}
        <span style="margin-right:auto"></span>
        ${S.sec < F.sections.length - 1 ? `<button class="btn primary" onclick="setSec(${S.sec + 1})">${esc(F.sections[S.sec + 1].name)} →</button>` : `<a class="btn primary" href="#results/${t.id}">See results</a>`}
      </div>
      <details style="margin-top:22px"><summary>Answer key and other options</summary>
        <div class="row" style="margin-top:10px">
          <button class="btn" onclick="replaceKey('${t.id}')">Load a different answer key</button>
          <button class="btn danger" onclick="clearAnswers('${t.id}')">Clear my answers</button>
          ${t.id.startsWith("custom-") ? `<button class="btn danger" onclick="removeTest('${t.id}')">Remove this test</button>` : ""}
        </div></details>`;
  }
  document.getElementById("app").innerHTML = `<div class="wrap page" style="padding-top:16px">
    <div class="row" style="margin-bottom:12px"><a href="#home" class="btn ghost">← All tests</a>
      <h1 style="font-size:20px;margin-right:auto">${esc(t.name)}</h1>
      ${ready ? `<span class="muted small num">${st.a}/${st.n} answered · ${st.c} correct</span><a class="btn" href="#results/${t.id}">Results</a>` : ""}</div>
    <div class="panel" style="display:grid;gap:10px">
      <div class="small muted">${esc(F.label)} · ${F.sections.map((s) => `${esc(s.name)} ${s.n}`).join(" · ")}</div>${links}</div>
    ${ready ? "" : keyPanel}
    ${body}
  </div>`;
  if (!ready) wireDrop(t);
}
function qRow(t, sec, q, ans, correct) {
  const k = S.sec + ":" + q;
  const grid = !/^[A-K]$/.test(correct || "") && sec.kind === "math";
  let input;
  if (ans) {
    input = grid ? `<span class="num"><b>${esc(ans.given)}</b></span>` : `<div class="bubbles">${choicesFor(sec.kind, q).map((L) =>
      `<button class="bub ${L === correct ? "right" : L === ans.given ? "wrong" : ""}" disabled aria-label="${L}${L === ans.given ? ", your answer" : ""}">${L}</button>`).join("")}</div>`;
  } else if (grid) {
    input = `<div class="spr"><input type="text" inputmode="decimal" autocomplete="off" placeholder="Your answer" aria-label="Question ${q} answer" value="${esc(S.sel[k] || "")}" oninput="S.sel['${k}']=this.value;document.getElementById('sb${q}').disabled=!this.value.trim()" onkeydown="if(event.key==='Enter'&&this.value.trim())submitQ('${t.id}',${q})"></div>`;
  } else {
    input = `<div class="bubbles" role="radiogroup" aria-label="Question ${q}">${choicesFor(sec.kind, q).map((L) =>
      `<button class="bub ${S.sel[k] === L ? "sel" : ""}" role="radio" aria-checked="${S.sel[k] === L}" onclick="pick(${q},'${L}')">${L}</button>`).join("")}</div>`;
  }
  const act = ans
    ? `<span class="verdict">${ans.ok ? "✓ Correct" : `✗ Answer: ${esc(correct)}`}</span>`
    : `<button class="btn primary" id="sb${q}" onclick="submitQ('${t.id}',${q})" ${S.sel[k] ? "" : "disabled"}>Submit</button>`;
  return `<div class="q ${ans ? (ans.ok ? "ok" : "no") : ""}" id="q${q}"><span class="n">${q}</span>${input}<span class="act">${act}</span></div>`;
}
function setSec(i) { const t = testById(S.testId); S.sec = i; D.last[t.id] = i; save(); renderTest(t); window.scrollTo({ top: 0 }); }
function pick(q, L) { S.sel[S.sec + ":" + q] = L; rerenderRow(q); }
function rerenderRow(q) {
  const t = testById(S.testId); const sec = fmt(t).sections[S.sec];
  const el = document.getElementById("q" + q);
  el.outerHTML = qRow(t, sec, q, answersOf(t)[S.sec + ":" + q], D.keys[t.id][S.sec][q - 1]);
}
function submitQ(id, q) {
  const t = testById(id); const k = S.sec + ":" + q; const given = String(S.sel[k] || "").trim();
  if (!given || answersOf(t)[k]) return;
  const correct = D.keys[id][S.sec][q - 1];
  answersOf(t)[k] = { given, ok: isCorrect(given, correct), at: Date.now() };
  delete S.sel[k]; D.last[id] = S.sec; save();
  rerenderRow(q);
  const x = secStats(t, S.sec);
  document.querySelectorAll(".tab small")[S.sec].textContent = `${x.a}/${x.n}`;
}

/* ---------- loading keys ---------- */
function wireDrop(t) {
  const drop = document.getElementById("drop"); const input = document.getElementById("keyFile");
  input.onchange = () => input.files[0] && readKeyFile(t, input.files[0]);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) readKeyFile(t, f); };
}
async function readKeyFile(t, file) {
  const drop = document.getElementById("drop"); drop.innerHTML = `<p style="margin:0">Reading ${esc(file.name)}…</p>`;
  try {
    const pages = await pdfText(file);
    const secs = fmt(t).sections;
    storeKey(t, parseKey(keyPages(pages, secs), secs));
    const n = keyCount(t);
    if (!n) toast("Couldn't find an answer key in that PDF. Check it's the right file, or paste the key text.");
    else if (keyReady(t)) toast("Answer key loaded. Answers stay hidden until you submit.");
    else toast(`Found ${n} of ${totalQs(t)} answers. Paste the missing section's key to finish.`);
  } catch (e) {
    console.error(e); toast("Couldn't read that file. Try the paste option instead.");
  }
  renderTest(t);
}
function pasteKey(id) {
  const t = testById(id); const si = Number(document.getElementById("pasteSec").value);
  const text = document.getElementById("pasteText").value;
  const sec = fmt(t).sections[si];
  const one = parseKey([text], [sec])[0];
  const found = one.filter(Boolean).length;
  if (!found) return toast("No answers found in that text.");
  const cur = D.keys[id] || fmt(t).sections.map(() => []);
  cur[si] = one; D.keys[id] = cur; save();
  toast(`${sec.name}: ${found} of ${sec.n} answers found.`);
  renderTest(t);
}
function replaceKey(id) {
  confirmBox("Load a different answer key? Answers you've already submitted stay as they were graded.", "Continue", () => {
    delete D.keys[id]; save(); renderTest(testById(id));
  });
}
function clearAnswers(id) {
  confirmBox(`Clear every answer in ${testById(id).name}? This can't be undone.`, "Clear answers", () => {
    D.answers[id] = {}; save(); toast("Answers cleared"); renderTest(testById(id));
  });
}
function removeTest(id) {
  confirmBox("Remove this test and its answers?", "Remove", () => {
    D.custom = D.custom.filter((t) => t.id !== id); delete D.keys[id]; delete D.answers[id]; save(); location.hash = "home";
  });
}
function addTestDialog() {
  const el = document.createElement("div"); el.className = "scrim";
  el.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-label="Add a test">
    <h2 style="font-size:17px">Add an official test</h2>
    <p class="small muted" style="margin:0">For example an older free ACT, or a test from the Official ACT Prep Guide.</p>
    <label>Name<input type="text" id="aName" placeholder="ACT Practice Test 2023–24"></label>
    <label>Format<select id="aFmt"><option value="actold">ACT before 2025 (English 75, Math 60, Reading 40, Science 40)</option><option value="act">ACT 2025 and later (50 / 45 / 36 / 40)</option><option value="sat">Digital SAT (27 / 27 / 22 / 22)</option></select></label>
    <label>Link to the test PDF (optional)<input type="url" id="aUrl" placeholder="https://"></label>
    <div class="row"><button class="btn" id="aNo">Cancel</button><button class="btn primary" id="aYes">Add test</button></div></div>`;
  document.body.appendChild(el);
  el.querySelector("#aNo").onclick = () => el.remove();
  el.querySelector("#aYes").onclick = () => {
    const name = el.querySelector("#aName").value.trim(); if (!name) return el.querySelector("#aName").focus();
    let url = el.querySelector("#aUrl").value.trim(); if (url && !/^https?:\/\//i.test(url)) url = "";
    const t = { id: "custom-" + Date.now().toString(36), name, format: el.querySelector("#aFmt").value, testUrl: url || null };
    D.custom.push(t); save(); el.remove(); location.hash = "t/" + t.id;
  };
  el.querySelector("#aName").focus();
}
function confirmBox(msg, ok, fn) {
  const el = document.createElement("div"); el.className = "scrim";
  el.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><p style="margin:0">${esc(msg)}</p><div class="row"><button class="btn" id="cNo">Cancel</button><button class="btn primary" id="cYes">${esc(ok)}</button></div></div>`;
  document.body.appendChild(el);
  el.querySelector("#cNo").onclick = () => el.remove();
  el.querySelector("#cYes").onclick = () => { el.remove(); fn(); };
  el.querySelector("#cYes").focus();
}

/* ---------- results ---------- */
function bars(entries) {
  return entries.map(([label, c, n, sub]) => {
    const f = n ? c / n : 0; const cls = f >= 0.75 ? "" : f >= 0.5 ? "mid" : "low";
    return `<div class="r"><div>${label}${sub ? `<div class="small muted">${sub}</div>` : ""}</div><div class="bar s ${cls}"><i style="width:${pct(c, n)}%"></i></div><div class="val">${n ? `${c}/${n} · ${pct(c, n)}%` : "—"}</div></div>`;
  }).join("");
}
function renderResults() {
  const all = tests(); const started = all.filter((t) => testStats(t).a);
  const chosen = S.resultsFor === "all" ? started : [testById(S.resultsFor)].filter(Boolean);
  const picker = `<div class="picker"><button class="btn ${S.resultsFor === "all" ? "primary" : ""}" onclick="S.resultsFor='all';renderResults()">All tests</button>${started.map((t) =>
    `<button class="btn ${S.resultsFor === t.id ? "primary" : ""}" onclick="S.resultsFor='${t.id}';renderResults()">${esc(t.name)}</button>`).join("")}</div>`;
  let html = `<div class="wrap page"><h1>My results</h1><p class="lede muted">Built only from answers you've submitted.</p>`;
  if (!started.length) {
    document.getElementById("app").innerHTML = html + `<div class="panel" style="text-align:center;padding:28px"><p class="muted" style="margin:0">No answers yet. Open a test, load its key, and submit a few answers.</p></div></div>`;
    return;
  }
  html += picker;
  // by subject across the chosen tests
  const subj = {}; let mc = [0, 0], grid = [0, 0];
  for (const t of chosen) {
    const F = fmt(t); const A = answersOf(t);
    F.sections.forEach((s, i) => {
      const key = `${F.exam} ${s.subject}`; subj[key] ||= [0, 0];
      for (let q = 1; q <= s.n; q++) {
        const x = A[i + ":" + q]; if (!x) continue;
        subj[key][1]++; if (x.ok) subj[key][0]++;
        if (s.kind === "math" && F.exam === "SAT") {
          const isGrid = !/^[A-K]$/.test((D.keys[t.id] || [])[i]?.[q - 1] || "");
          const b = isGrid ? grid : mc; b[1]++; if (x.ok) b[0]++;
        }
      }
    });
  }
  const tot = Object.values(subj).reduce((a, [c, n]) => [a[0] + c, a[1] + n], [0, 0]);
  const order = ["SAT Reading and Writing", "SAT Math", "ACT English", "ACT Math", "ACT Reading", "ACT Science"];
  const subjRows = order.filter((k) => subj[k]).map((k) => [esc(k), subj[k][0], subj[k][1]]);
  const ranked = order.filter((k) => subj[k] && subj[k][1] >= 5).sort((a, b) => subj[a][0] / subj[a][1] - subj[b][0] / subj[b][1]);
  html += `<div class="panel"><h2>${S.resultsFor === "all" ? "All tests" : esc(chosen[0].name)} · ${tot[0]} of ${tot[1]} correct (${pct(tot[0], tot[1])}%)</h2>
    ${ranked.length > 1 ? `<p class="small muted" style="margin:0">Strongest: <b>${esc(ranked[ranked.length - 1])}</b> · Weakest: <b>${esc(ranked[0])}</b></p>` : ""}
    <div class="rows">${bars(subjRows)}</div>
    ${mc[1] + grid[1] ? `<div class="rows" style="margin-top:16px">${bars([["SAT Math · multiple choice", mc[0], mc[1]], ["SAT Math · type-in answers", grid[0], grid[1]]])}</div>` : ""}</div>`;
  // test by test, section by section
  for (const exam of ["SAT", "ACT"]) {
    const ts = chosen.filter((t) => fmt(t).exam === exam); if (!ts.length) continue;
    const secs = FORMATS[exam === "SAT" ? "sat" : "act"].sections;
    html += `<div class="panel"><h2>${exam} by test and section</h2><p class="small muted" style="margin:0">Correct out of answered. Use the score table in the official PDF to turn a finished section's raw score into a scaled score.</p>
      <div class="scroll"><table class="grid" style="margin-top:10px"><thead><tr><th>Test</th>${secs.map((s) => `<th>${esc(s.name.replace("Reading and Writing", "R&W"))}</th>`).join("")}<th>Total</th></tr></thead><tbody>
      ${ts.map((t) => { const st = testStats(t); return `<tr><td><a href="#t/${t.id}">${esc(t.name)}</a></td>${fmt(t).sections.map((_, i) => { const x = secStats(t, i); return `<td>${x.a ? `${x.c}/${x.a}` : "—"}</td>`; }).join("")}<td><b>${st.c}/${st.a}</b></td></tr>`; }).join("")}
      </tbody></table></div></div>`;
  }
  // missed questions for one test
  if (S.resultsFor !== "all") {
    const t = chosen[0]; const A = answersOf(t);
    html += `<div class="panel"><h2>Questions you missed</h2><p class="small muted" style="margin:0">Tap a number to go back to it.</p>
      ${fmt(t).sections.map((s, i) => { const m = []; for (let q = 1; q <= s.n; q++) { const x = A[i + ":" + q]; if (x && !x.ok) m.push(q); }
        return `<div style="margin-top:12px"><b class="small">${esc(s.name)}</b> <span class="small muted">${m.length ? `${m.length} missed` : secStats(t, i).a ? "none missed" : "not started"}</span>
          <div class="missed">${m.map((q) => `<button onclick="goTo('${t.id}',${i},${q})">${q}</button>`).join("")}</div></div>`; }).join("")}</div>`;
  }
  html += `<div class="panel"><h2>Back up my answers</h2><p class="small muted" style="margin:0 0 10px">Everything is saved in this browser. Download a backup to move it to another device or keep it safe.</p>
    <div class="row"><button class="btn" onclick="exportData()">Download backup</button><label class="btn">Restore from backup<input type="file" accept="application/json,.json" hidden onchange="importData(this.files[0])"></label></div></div>`;
  document.getElementById("app").innerHTML = html + `</div>`;
}
function goTo(id, si, q) {
  S.testId = id; S.sec = si; S.sel = {}; D.last[id] = si; save();
  location.hash = "t/" + id;
  setTimeout(() => { const el = document.getElementById("q" + q); if (el) el.scrollIntoView({ block: "center" }); }, 50);
}
function exportData() {
  const blob = new Blob([JSON.stringify(D, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "practice-tests-backup-" + new Date().toISOString().slice(0, 10) + ".json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function importData(file) {
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!d || d.v !== 1 || typeof d.answers !== "object") throw new Error("bad");
    confirmBox("Replace what's saved in this browser with this backup?", "Restore", () => { D = d; save(); toast("Backup restored"); route(); });
  } catch { toast("That file isn't a backup from this page."); }
}

route();
</script>
</body>
</html>
